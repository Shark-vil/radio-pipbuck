<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLP Radio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    font-family: 'Segoe UI', sans-serif; color: #fff;
  }
  .player {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 24px; padding: 40px;
    text-align: center; min-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  #track {
    font-size: 16px; color: #a8b2d1; margin-bottom: 24px;
    min-height: 24px; transition: opacity 0.3s;
  }

  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-bottom: 16px;
  }
  .btn {
    width: 56px; height: 56px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 24px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
  .btn:active { transform: scale(0.92); }
  .btn.playing { background: rgba(100,255,218,0.25); }

  .volume-wrap {
    display: flex; align-items: center; gap: 8px;
    justify-content: center; margin-bottom: 20px;
  }
  .vol-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: none; background: rgba(255,255,255,0.12);
    color: #fff; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .vol-btn:hover { background: rgba(255,255,255,0.22); }
  .vol-btn:active { transform: scale(0.9); }
  #volDisplay {
    min-width: 36px; text-align: center;
    font-size: 14px; color: #a8b2d1;
  }

  .status-badge {
    display: inline-block; padding: 4px 12px;
    border-radius: 12px; font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badge.live { background: rgba(255,60,60,0.3); color: #ff6b6b; }
  .status-badge.offline { background: rgba(255,255,255,0.1); color: #888; }

  .stats { font-size: 12px; color: #556; }

  /* Playlist Panel */
  .playlist-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(500px, 90vw);
    height: 100vh;
    background: linear-gradient(180deg, #1a1a2e, #16213e);
    box-shadow: -4px 0 24px rgba(0,0,0,0.5);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
  }
  .playlist-panel.hidden { transform: translateX(100%); }
  .playlist-panel:not(.hidden) { transform: translateX(0); }

  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .playlist-header h2 { font-size: 20px; margin: 0; }
  .close-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .close-btn:hover { background: rgba(255,255,255,0.2); }

  .playlist-tabs {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .tab-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #a8b2d1;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: rgba(100,255,218,0.2);
    color: #fff;
  }
  .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.12); }

  .playlist-content {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: none;
  }
  .tab-content.active { display: block; }

  .search-wrap { margin-bottom: 16px; }
  .search-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: rgba(100,255,218,0.5); }
  .search-input::placeholder { color: #556; }

  .songs-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .song-item {
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    transition: background 0.15s;
    cursor: default;
  }
  .song-item:hover { background: rgba(255,255,255,0.1); }
  .song-item.current {
    background: rgba(100,255,218,0.15);
    border-left: 3px solid #64ffda;
  }
  .song-number {
    font-size: 12px;
    color: #556;
    margin-bottom: 4px;
  }
  .song-title {
    font-size: 14px;
    color: #a8b2d1;
  }
  .song-item.current .song-title {
    color: #fff;
    font-weight: 600;
  }

  .current-song {
    padding: 20px;
    border-radius: 12px;
    background: rgba(100,255,218,0.1);
    margin-bottom: 24px;
    text-align: center;
  }
  .current-song h3 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #fff;
  }
  .current-song .playing-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }

  .queue-info { padding: 0 8px; }
  .queue-info h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #a8b2d1;
  }
  .queue-note {
    font-size: 13px;
    color: #556;
    line-height: 1.5;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: #556;
    font-size: 14px;
  }

  /* Overlay */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div class="player">
  <div class="icon">📻</div>
  <h1>MLP Radio</h1>
  <div class="status-badge offline" id="badge">OFFLINE</div>
  <div id="track">Загрузка...</div>

  <div class="controls">
    <button class="btn" id="playBtn" title="Play / Pause">▶</button>
    <button class="btn" id="playlistBtn" title="Список песен">🎵</button>
  </div>

  <div class="volume-wrap">
    <button class="vol-btn" id="volDown">−</button>
    <span id="volDisplay">70</span>
    <button class="vol-btn" id="volUp">+</button>
  </div>

  <div class="stats" id="stats"></div>
</div>

<!-- Скрытый аудио — НИКАКОГО UI -->
<audio id="audio" preload="none" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;"></audio>

<!-- Панель списка песен -->
<div id="playlistPanel" class="playlist-panel hidden">
  <div class="playlist-header">
    <h2>📜 Список песен</h2>
    <button class="close-btn" id="closePlaylist">✕</button>
  </div>
  <div class="playlist-tabs">
    <button class="tab-btn active" data-tab="all">Все песни (<span id="totalCount">0</span>)</button>
    <button class="tab-btn" data-tab="current">Сейчас играет</button>
  </div>
  <div class="playlist-content">
    <div id="allSongsTab" class="tab-content active">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 Поиск песни..." class="search-input">
      </div>
      <div id="songsList" class="songs-list">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
    <div id="currentTab" class="tab-content">
      <div class="current-song" id="currentSong">
        <div class="loading">Загрузка...</div>
      </div>
      <div class="queue-info">
        <h3>Очередь воспроизведения</h3>
        <p class="queue-note">Песни выбираются случайным образом из всей коллекции</p>
      </div>
    </div>
  </div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<script>
const audioEl  = document.getElementById('audio');
const trackEl  = document.getElementById('track');
const playBtn  = document.getElementById('playBtn');
const volDown  = document.getElementById('volDown');
const volUp    = document.getElementById('volUp');
const volDisplay = document.getElementById('volDisplay');
const badge    = document.getElementById('badge');
const statsEl  = document.getElementById('stats');

let isPlaying = false;
let volume = 70;

function setVol(v) {
  volume = Math.max(0, Math.min(100, v));
  volDisplay.textContent = volume;
  audioEl.volume = volume / 100;
}

volDown.addEventListener('click', () => setVol(volume - 10));
volUp.addEventListener('click', () => setVol(volume + 10));
setVol(volume);

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    audioEl.pause();
    audioEl.src = '';
    isPlaying = false;
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
    badge.textContent = 'OFFLINE';
    badge.className = 'status-badge offline';
  } else {
    connectStream();
  }
});

function connectStream() {
  audioEl.src = '/stream';
  audioEl.onplaying = () => {
    isPlaying = true;
    playBtn.textContent = '⏸';
    playBtn.classList.add('playing');
    badge.textContent = 'LIVE';
    badge.className = 'status-badge live';
  };
  audioEl.onended = () => { connectStream(); };
  audioEl.onerror = () => {
    if (isPlaying) {
      setTimeout(() => connectStream(), 1000);
    }
  };
  audioEl.play();
}

// SSE — название трека
const es = new EventSource('/title-stream');
es.onmessage = (e) => { trackEl.textContent = e.data; };
es.onerror = () => {};

// Статус
async function updateStats() {
  try {
    const r = await fetch('/status');
    const d = await r.json();
    statsEl.textContent = `Слушателей: ${d.listeners} · ${d.bitrate} kbps`;
  } catch {}
}
setInterval(updateStats, 10000);
updateStats();

// ─── Playlist Panel ──────────────────────────────────────────
const playlistBtn = document.getElementById('playlistBtn');
const closePlaylist = document.getElementById('closePlaylist');
const playlistPanel = document.getElementById('playlistPanel');
const overlay = document.getElementById('overlay');
const songsList = document.getElementById('songsList');
const currentSong = document.getElementById('currentSong');
const totalCount = document.getElementById('totalCount');
const searchInput = document.getElementById('searchInput');
const tabBtns = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');

let playlistData = null;
let filteredSongs = [];

function openPlaylist() {
  playlistPanel.classList.remove('hidden');
  overlay.classList.add('visible');
  loadPlaylist();
}

function closePlaylistPanel() {
  playlistPanel.classList.add('hidden');
  overlay.classList.remove('visible');
}

playlistBtn.addEventListener('click', openPlaylist);
closePlaylist.addEventListener('click', closePlaylistPanel);
overlay.addEventListener('click', closePlaylistPanel);

// Tab switching
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    
    tabBtns.forEach(b => b.classList.remove('active'));
    tabContents.forEach(c => c.classList.remove('active'));
    
    btn.classList.add('active');
    document.getElementById(tab === 'all' ? 'allSongsTab' : 'currentTab').classList.add('active');
  });
});

async function loadPlaylist() {
  if (playlistData) return; // Already loaded
  
  try {
    const r = await fetch('/playlist');
    playlistData = await r.json();
    
    totalCount.textContent = playlistData.total;
    filteredSongs = playlistData.all_songs;
    
    renderSongsList(filteredSongs);
    renderCurrentSong();
  } catch (e) {
    songsList.innerHTML = '<div class="loading">Ошибка загрузки</div>';
    currentSong.innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

function renderSongsList(songs) {
  if (!songs.length) {
    songsList.innerHTML = '<div class="loading">Нет песен</div>';
    return;
  }
  
  songsList.innerHTML = songs.map((song, i) => {
    const isCurrent = song.title === playlistData.current;
    return `
      <div class="song-item ${isCurrent ? 'current' : ''}">
        <div class="song-number">#${i + 1}</div>
        <div class="song-title">${song.title}</div>
      </div>
    `;
  }).join('');
}

function renderCurrentSong() {
  currentSong.innerHTML = `
    <div class="playing-icon">🎵</div>
    <h3>${playlistData.current}</h3>
  `;
}

// Search functionality
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  if (!query) {
    filteredSongs = playlistData.all_songs;
  } else {
    filteredSongs = playlistData.all_songs.filter(song => 
      song.title.toLowerCase().includes(query)
    );
  }
  renderSongsList(filteredSongs);
});
</script>
</body>
</html>
